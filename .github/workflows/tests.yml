name: Synthetic tests and requirement evaluations
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      require_product:
        description: 'Require live product qualification (currently blocked)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unit and synthetic MCP tests (no live desktops)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Requirement evaluations (no live desktops)
        run: python -m evals.run --output eval-artifacts ${{ inputs.require_product && '--require-product' || '' }}
      - name: Retain evaluation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.os }}
          path: eval-artifacts/
          if-no-files-found: warn
          retention-days: 14
